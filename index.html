<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Spotify</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Pomodoro Spotify</h1>

    <button id="connect-button">Se connecter à Spotify</button>

    <p id="timer-display">45:00</p>
    <button id="start-button">Démarrer (45 min)</button>

    <p id="message" role="status"></p>
  </main>

  <!-- type="module" permet de découper le JavaScript en plusieurs fichiers -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
